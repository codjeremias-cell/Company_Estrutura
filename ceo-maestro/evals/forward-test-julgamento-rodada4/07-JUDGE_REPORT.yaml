achado_das_duas_arvores:   # PEND-DUAS-ARVORES-UM-DIGEST, da rodada anterior
  pendencia_anterior: PEND-DUAS-ARVORES-UM-DIGEST
  status: RESOLVIDA_COM_RESSALVA
  medicao: >-
    Os dois digests declarados foram RECALCULADOS por reimplementacao independente
    da receita de digest_de_arvore e batem exatamente. Comparados os 25 arquivos um
    a um: 24 sao BYTE-IDENTICOS entre runtime e fonte. Exatamente 1 diverge --
    RESPOSTA-FRENTE-JURIDICA-2026-07-27.md (runtime LF, fonte CRLF).
  ressalva: >-
    A caracterizacao "a divergencia entre as duas e de fim de linha" e imprecisa
    como enunciada. Nao ha divergencia sistemica de EOL: 24 de 25 arquivos sao
    CRLF nos DOIS lados e identicos byte a byte. O que ha e UM arquivo cujo EOL
    foi normalizado para LF so no runtime -- anomalia pontual de espelhamento,
    nao regime de EOL distinto entre as arvores.
  invalida_o_julgamento: false
  invalida_o_julgamento_porque: >-
    O unico arquivo divergente nao e evidencia de nenhum dos 8 criterios. Para os
    25 arquivos que sustentam os criterios, julgar o runtime e julgar a fonte:
    sao os mesmos bytes. O veredito vale para as duas arvores.
  achado_derivado: >-
    Um espelho que normaliza o EOL de um unico arquivo produz, por construcao,
    dois digests de arvore para o mesmo conteudo logico -- e a receita e
    deliberadamente sensivel a EOL. Enquanto o deploy nao fixar EOL, todo
    candidate_tree_sha256 vale para UMA copia so, e precisa dizer qual.

