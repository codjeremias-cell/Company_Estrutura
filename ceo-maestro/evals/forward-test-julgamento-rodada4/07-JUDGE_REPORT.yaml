crit_06_ruling:   # pedido explicito de Jeremias
  pergunta: "O R9 fecha a lacuna DE VERDADE, ou e a mesma evasao com outra roupa?"
  resposta: "FECHA. Nao e evasao reincidente."
  score: 8
  score_anterior: 6
  fundamento: >-
    A rodada 3 reprovou a tentativa anterior porque ela RETIRAVA o item da secao
    de nao-provado, reclassificando-o como "prova pendente". A correcao desta
    rodada faz o oposto: o item voltou para a secao de nao-provado (PLACAR.md:93)
    e passou a citar R9. O R9 (protocolo:444) nomeia causa medida
    ("departamento=0 ; agente=0"), efeito ("nenhuma bateria prova que a skill
    dispara sozinha"), conduta ("declarar o SKIP em vez de simula-lo") e condicao
    de fechamento externa e falsificavel ("fecha so se a instalacao mudar --
    decisao de runtime, fora do alcance deste protocolo"). Os quatro elementos de
    um risco residual legitimo. A condicao nao e tautologica nem vazia. Nenhuma
    ausencia de prova foi convertida em "esta tudo bem".
  o_que_ainda_nao_e_10:
    - "evals/FORWARD-TEST.md:97-98 mantem viva a tese que o R9 nega -- 'nao foi medido porque a skill ainda estava em staging ... deve ser rechecado apos instalacao', ou seja, 'prova pendente, fechavel'. E a premissa caducou: o pacote ESTA instalado no runtime. Contradicao interna, e nenhuma checagem le esse arquivo."
    - "A trava nova (validate_workflow.py:1671-1676) so enxerga itens DENTRO da secao '## O que ainda nao foi provado'. Item movido para uma secao irma continua invisivel -- a manobra exata da rodada 3 segue possivel. A docstring (:1652-1654) promete que 'a proxima tentativa falhe alto'; ela falha alto so no caso que ja foi corrigido."

