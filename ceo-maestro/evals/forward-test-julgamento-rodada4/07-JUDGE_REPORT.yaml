defeitos_que_permanecem:
  - id: D1
    criterio: CRIT-07
    severidade: alta
    arquivo: "evals/PLACAR.md:127"
    achado: >-
      A string `APROVADO PARA PROMOCAO` sobrevive sob '## Decisao'. O proprio
      pacote proibe essa palavra em tres camadas (protocolo:410;
      FORBIDDEN_PROPERTIES; regex \baprovad[oa]s?\b em validate_workflow.py:176).
      Escapa porque judgment_language_errors so roda sobre dict -- NENHUM .md do
      pacote e varrido. O motor do candidato reprovaria a propria frase se a alcancasse.
    efeito: "Derrubou CRIT-07 de 9 para 8. A descontaminacao removeu o veredito do gate, mas deixou vocabulario de julgamento para tras."
  - id: D2
    criterio: CRIT-06
    severidade: media
    arquivo: "evals/FORWARD-TEST.md:97-98"
    achado: "Tese 'prova pendente, fechavel' viva dentro do pacote, contradizendo o R9."
  - id: D3
    criterio: "CRIT-04 / CRIT-06 / CRIT-05"
    severidade: media
    arquivo: "references/protocolo-inovacao-melhoria.md:443-444"
    achado: >-
      Uma linha em branco encerra a tabela de riscos ANTES da linha do R9. O R9
      renderiza como paragrafo solto com pipes, fora da tabela onde R1-R8 moram.
      As duas travas em codigo conferem presenca de string, nao continuidade de
      tabela, e por isso nenhuma pega. Correcao de uma linha.
  - id: D4
    criterio: CRIT-05
    severidade: media
    arquivo: "validate_workflow.py:1467 x SKILL.md:203-205 x protocolo:303-306"
    achado: >-
      A prosa promete recalcular gate_checks a partir dos 'retornos ACEITOS'; o
      codigo deriva de TODOS os retornos. Divergencia literal entre norma e trava,
      nao declarada e nao coberta por nenhum R.
  - id: D5
    criterio: CRIT-04
    severidade: media
    arquivo: "schemas/departamento-inovacao-melhoria.schema.json x diretor-de-lentes.schema.json"
    achado: >-
      O schema local admite 4 classes de envelope que o schema do superior recusa
      (candidate_digest 'n/a'; evidence_refs vazio; identifier com '/' '@' ou >128;
      round >10). Nenhuma exercitada, nenhuma declarada como limite. Carregado da rodada 3.
  - id: D6
    criterio: CRIT-07
    severidade: baixa
    arquivo: "RESPOSTA-FRENTE-JURIDICA-2026-07-27.md:6"
    achado: "Declara 'nao versionado'; `git ls-files \"*FRENTE-JURIDICA*\"` devolve 6 caminhos rastreados. Alegacao falsa dentro do pacote."

