crit_06_ruling:
  pergunta: >-
    A reclassificacao de 'prova pendente' vs 'limite residual' e legitima pelo
    paragrafo 12 do protocolo, ou e evasao?
  otica_dona: robustez-e-evidencia
  ruling: EVASION
  distincao_registrada: >-
    A CATEGORIA e legitima; a APLICACAO ao item P1 nao e. O protocolo mantem
    casa separada para o que e fechavel (pending/execution_requests §7,
    MEASUREMENT_REQUIRED, CAPABILITY_SEARCH_PENDING), entao separar prova
    pendente de limite residual e estruturalmente valido. O defeito nao esta na
    ideia da separacao; esta em qual gaveta o P1 foi posto.
  tres_falhas_verificaveis:
    - "A justificativa cita METADE da definicao. O §12 define limite residual como 'limites do RUNTIME, nao descuido de execucao: nenhuma regra deste protocolo os fecha' (protocolo:429-431). O PLACAR:100-101 cita so a segunda metade e descarta 'limites do runtime' — que e exatamente onde P1 cai."
    - "O fechador proposto nao e regra deste protocolo. PLACAR:115-116 diz que P1 'fecha com uma rodada de forward contra o pacote instalado no runtime'; nenhuma das §1-§11 fecha cobertura de forward test. Nem sob a leitura truncada o argumento se sustenta."
    - "A premissa de fato e contradita por medicao DENTRO do proprio candidato. PLACAR:110-111 afirma que as provas pendentes 'tem caminho conhecido para fechar'; RESPOSTA-FRENTE-JURIDICA-2026-07-27.md:71-73 registra medicao executada: 'os 15 gerentes e os 66 agentes aninhados NAO viram skills invocaveis'. Este Departamento e um dos 15. Isso e limite do runtime — a primeira metade do §12."
  ancora_documental_ausente: >-
    A reclassificacao apoia-se em autocitacao (PLACAR:102-103, "ele mesmo dizia
    'so fecha depois da instalacao no runtime'"), e essa string nao existe em
    nenhum outro ponto do candidato: o texto citado foi sobrescrito. A prova de
    que o item fecha e uma versao anterior do proprio placar afirmando que
    fecharia.
  efeito_liquido: >-
    O unico item nao provado que nao encaixava em R1-R8 — e que exigiria abrir
    um R9 no §12, ja que o §12 proibe declarar limite fora dele — mudou de
    gaveta em vez de mudar o §12, e a clausula passou a ser reportavel como
    satisfeita sem prova nova.
  credito_devido: >-
    PLACAR:117-121 recusa explicitamente contar as quatro rodadas de cadeia como
    acionamento deste Departamento. Honestidade real sobre o estado, e conta.
    Nao conserta a classificacao.

